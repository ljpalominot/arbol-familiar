<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Árbol Genealógico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#221C15;
    --paper:#F4EEE0;
    --paper-2:#E9E0C9;
    --card:#FCFAF3;
    --wine:#7C3548;
    --wine-dark:#4F2130;
    --sage:#5C7360;
    --sage-dark:#3F5341;
    --gold:#AD8636;
    --line:#8C8267;
    --muted:#7A7261;
    --shadow: 0 1px 2px rgba(33,28,22,0.10), 0 6px 16px rgba(33,28,22,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{min-height:100vh;display:flex;flex-direction:column;}

  /* Header */
  header{
    background:linear-gradient(160deg,var(--wine-dark), var(--wine) 130%);
    color:#F4EEE0;
    padding:28px 24px 22px;
    position:relative;
    overflow:hidden;
  }
  header::before{
    content:'';
    position:absolute; inset:0;
    background-image: radial-gradient(circle at 15% 20%, rgba(255,255,255,0.06) 0, transparent 45%),
                       radial-gradient(circle at 85% 80%, rgba(255,255,255,0.05) 0, transparent 40%);
    pointer-events:none;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:#D9C79B;
    margin:0 0 6px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(28px,5vw,42px);
    margin:0;
    letter-spacing:-0.01em;
  }
  .sub{
    margin:8px 0 0;
    font-size:14px;
    color:#E7D9BA;
    max-width:560px;
    line-height:1.5;
  }
  .toolbar{
    display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; position:relative;
  }
  .btn{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    border:none;
    border-radius:8px;
    padding:10px 16px;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn-primary{background:var(--gold); color:#2A2010;}
  .btn-primary:hover{box-shadow:0 4px 14px rgba(173,134,54,0.4);}
  .btn-ghost{background:rgba(255,255,255,0.12); color:#F4EEE0; border:1px solid rgba(255,255,255,0.25);}
  .btn-ghost:hover{background:rgba(255,255,255,0.2);}

  /* Tree area */
  main{flex:1; overflow:auto; padding:40px 24px 80px;}
  .tree-scroll{min-width:max-content; margin:0 auto;}
  .tree{ text-align:center; }
  .tree ul{
    display:flex;
    padding-top:44px;
    position:relative;
    justify-content:center;
  }
  .tree > ul{padding-top:0;}
  .tree li{
    display:flex; flex-direction:column; align-items:center;
    list-style:none;
    position:relative;
    padding:44px 14px 0 14px;
  }
  .tree li::before, .tree li::after{
    content:''; position:absolute; top:0; right:50%;
    border-top:2px solid var(--line);
    width:50%; height:44px;
  }
  .tree li::after{ right:auto; left:50%; border-left:2px solid var(--line);}
  .tree li:only-child::after, .tree li:only-child::before{display:none;}
  .tree li:only-child{padding-top:0;}
  .tree li:first-child::before{border:0 none;}
  .tree li:last-child::after{border:0 none;}
  .tree li:last-child::before{border-right:2px solid var(--line); border-radius:0 6px 0 0;}
  .tree li:first-child::after{border-radius:6px 0 0 0;}
  .tree ul ul::before{
    content:''; position:absolute; top:0; left:50%;
    border-left:2px solid var(--line); width:0; height:44px;
  }
  .tree > ul > li{padding-top:0;}
  .tree > ul > li::before, .tree > ul > li::after{display:none;}

  .node{display:flex; gap:10px; align-items:flex-end;}

  .col-wrap{display:flex; flex-direction:column; align-items:center; gap:6px;}
  .parent-add{
    width:auto; padding:2px 9px; height:20px;
    border-radius:20px;
    border:1px dashed var(--line);
    background:transparent;
    color:var(--muted);
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    white-space:nowrap;
  }
  .parent-add:hover{border-color:var(--gold); color:var(--gold); border-style:solid;}

  .card{
    background:var(--card);
    border:1px solid var(--paper-2);
    border-radius:12px;
    box-shadow:var(--shadow);
    padding:10px 14px 10px 10px;
    width:172px;
    display:flex; align-items:center; gap:10px;
    text-align:left;
    cursor:pointer;
    position:relative;
    transition:box-shadow .15s ease, transform .15s ease, border-color .15s ease;
  }
  .card:hover{
    box-shadow:0 2px 4px rgba(33,28,22,.12), 0 10px 22px rgba(33,28,22,.12);
    transform:translateY(-2px);
    border-color:var(--gold);
  }
  .avatar{
    width:38px; height:38px; border-radius:50%;
    flex:none;
    background:var(--sage);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-weight:600; font-size:14px;
    overflow:hidden;
    border:2px solid var(--paper-2);
  }
  .avatar.f{background:var(--wine);}
  .avatar img{width:100%; height:100%; object-fit:cover;}
  .card .name{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:13.5px;
    line-height:1.25;
    color:var(--ink);
  }
  .card .dates{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--muted);
    margin-top:3px;
    letter-spacing:.01em;
  }
  .union-plus{
    align-self:center;
    width:22px; height:22px;
    border-radius:50%;
    background:var(--paper-2);
    color:var(--wine-dark);
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700;
    cursor:pointer;
    flex:none;
    border:1px dashed var(--line);
  }
  .union-plus:hover{background:var(--gold); color:#2A2010; border-style:solid;}

  .child-add{
    margin-top:44px;
    width:36px; height:36px; border-radius:50%;
    border:1.5px dashed var(--line);
    background:transparent;
    color:var(--muted);
    font-size:16px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .child-add:hover{border-color:var(--gold); color:var(--gold);}

  .unconnected-wrap{
    max-width:900px; margin:56px auto 0; padding-top:28px; border-top:1px dashed var(--paper-2);
  }
  .unconnected-title{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--muted); margin-bottom:14px; text-align:center;
  }
  .unconnected-list{display:flex; flex-wrap:wrap; gap:10px; justify-content:center;}

  .empty{
    max-width:420px; margin:60px auto; text-align:center; color:var(--muted);
  }
  .empty h2{font-family:'Fraunces',serif; color:var(--ink); font-size:20px;}

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(34,28,21,0.45);
    display:none; align-items:center; justify-content:center; padding:20px; z-index:50;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--card); border-radius:14px; width:100%; max-width:420px;
    max-height:88vh; overflow-y:auto;
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
  }
  .modal-head{
    padding:20px 22px 14px; border-bottom:1px solid var(--paper-2);
    display:flex; align-items:center; justify-content:space-between;
  }
  .modal-head h3{font-family:'Fraunces',serif; margin:0; font-size:19px;}
  .modal-close{
    background:none; border:none; font-size:20px; cursor:pointer; color:var(--muted); line-height:1;
  }
  .modal-body{padding:18px 22px 22px;}
  .field{margin-bottom:14px;}
  .field label{
    display:block; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em;
    color:var(--muted); margin-bottom:6px;
  }
  .field input, .field select{
    width:100%; padding:9px 11px; border:1px solid var(--paper-2); border-radius:8px;
    font-family:'Inter',sans-serif; font-size:14px; background:#fff; color:var(--ink);
  }
  .field input:focus, .field select:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .row2{display:flex; gap:10px;}
  .row2 .field{flex:1;}
  .sex-toggle{display:flex; gap:8px;}
  .sex-btn{
    flex:1; padding:9px; border-radius:8px; border:1px solid var(--paper-2); background:#fff;
    cursor:pointer; font-size:13px; font-weight:600; color:var(--muted);
  }
  .sex-btn.active{background:var(--sage); color:#fff; border-color:var(--sage);}
  .sex-btn.active.f{background:var(--wine); border-color:var(--wine);}
  .modal-actions{display:flex; gap:10px; margin-top:18px;}
  .modal-actions .btn{flex:1;}
  .btn-danger{background:transparent; border:1px solid #B4485A; color:#B4485A;}
  .btn-secondary{background:var(--paper-2); color:var(--ink);}
  .hint{font-size:12px; color:var(--muted); margin-top:-6px; margin-bottom:14px; line-height:1.4;}
  .divider{border:none; border-top:1px solid var(--paper-2); margin:16px 0;}
  .link-btn{
    background:none; border:none; color:var(--wine); font-size:13px; font-weight:600; cursor:pointer;
    padding:0; text-decoration:underline; text-underline-offset:2px;
  }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(10px);
    background:var(--ink); color:#F4EEE0; padding:10px 18px; border-radius:8px;
    font-size:13px; opacity:0; pointer-events:none; transition:all .25s ease; z-index:60;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (max-width:600px){
    .card{width:140px; padding:8px 10px 8px 8px;}
    .card .name{font-size:12px;}
    header{padding:22px 16px 18px;}
    main{padding:28px 10px 60px;}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <p class="eyebrow" id="familyEyebrow">Archivo familiar</p>
    <h1 id="familyTitle">Familia Palomino</h1>
    <p class="sub">Árbol compartido — cualquiera con este enlace puede ver y editar. Los cambios se guardan automáticamente para todos.</p>
    <div class="toolbar">
      <button class="btn btn-primary" id="btnAddRoot">+ Agregar persona</button>
      <button class="btn btn-ghost" id="btnResetView" title="Recargar datos guardados">↻ Actualizar</button>
    </div>
  </header>

  <main>
    <div class="tree-scroll" id="treeScroll">
      <div id="treeContainer"></div>
      <div class="unconnected-wrap" id="unconnectedWrap" style="display:none;">
        <p class="unconnected-title">Personas sin conectar aún</p>
        <div class="unconnected-list" id="unconnectedList"></div>
      </div>
    </div>
  </main>
</div>

<!-- Modal: Add / Edit person -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">Agregar persona</h3>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody">
      <!-- filled dynamically -->
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const STORAGE_KEY = 'family-tree-data-v1';
  let state = null; // {people:{}, unions:{}}
  let currentContext = null; // for modal actions

  // ---------- Default seed data (from the user's diagram) ----------
  function seedData(){
    const people = {
      p1:{id:'p1', name:'Julio Cesar Palomino Meneses', birth:'', death:'', sex:'H', photo:''},
      p2:{id:'p2', name:'Martha Ines Gomez Anaya', birth:'', death:'', sex:'M', photo:''},
      p3:{id:'p3', name:'Dina Lucy Palomino de la Cruz', birth:'', death:'', sex:'M', photo:''},
      p4:{id:'p4', name:'Martha Elizabeth Palomino Gomez', birth:'', death:'', sex:'M', photo:''},
      p5:{id:'p5', name:'Cesar Julio Palomino Gomez', birth:'', death:'', sex:'H', photo:''},
      p6:{id:'p6', name:'Aldo Urbano Palomino Gomez', birth:'', death:'', sex:'H', photo:''},
      p7:{id:'p7', name:'Elba Esther Palomino Gomez', birth:'', death:'', sex:'M', photo:''},
      p8:{id:'p8', name:'Sandra Patricia Palomino Gomez', birth:'', death:'', sex:'M', photo:''},
      p9:{id:'p9', name:'Roxana Elvira Palomino Gomez', birth:'', death:'', sex:'M', photo:''},
      p10:{id:'p10', name:'Ruben Castro Llanos', birth:'', death:'', sex:'H', photo:''},
      p11:{id:'p11', name:'Angela Giuliana Castro Palomino', birth:'', death:'', sex:'M', photo:''},
      p12:{id:'p12', name:'Mabel Alexandra Castro Palomino', birth:'', death:'', sex:'M', photo:''},
      p13:{id:'p13', name:'Luisa Torres Vilca', birth:'', death:'', sex:'M', photo:''},
      p14:{id:'p14', name:'Rosa Ines Palomino Torres', birth:'', death:'', sex:'M', photo:''},
      p15:{id:'p15', name:'Laura Judith Palomino Torres', birth:'', death:'', sex:'M', photo:''},
      p16:{id:'p16', name:'Claudia Isabel Palomino Torres', birth:'', death:'', sex:'M', photo:''},
      p17:{id:'p17', name:'Maria Luisa Palomino Torres', birth:'', death:'', sex:'M', photo:''}
    };
    const unions = {
      u1:{id:'u1', partners:['p1','p2'], children:['p3','p4','p5','p6','p7','p8','p9']},
      u2:{id:'u2', partners:['p9','p10'], children:['p11','p12']},
      u3:{id:'u3', partners:['p6','p13'], children:['p14','p15','p16','p17']}
    };
    return {people, unions};
  }

  function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }

  // ---------- Storage ----------
  async function loadState(){
    try{
      const res = await window.storage.get(STORAGE_KEY, true);
      if(res && res.value){
        state = JSON.parse(res.value);
        return;
      }
    }catch(e){ /* key doesn't exist yet */ }
    state = seedData();
    await saveState();
  }

  async function saveState(){
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(state), true);
    }catch(e){
      showToast('No se pudo guardar. Revisa tu conexión.');
      console.error(e);
    }
  }

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2200);
  }

  // ---------- Helpers ----------
  function initials(name){
    return name.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
  }
  function yearOf(dateStr){
    if(!dateStr) return '';
    const m = dateStr.match(/^(\d{4})/);
    return m ? m[1] : dateStr;
  }
  function datesLabel(p){
    const b = yearOf(p.birth), d = yearOf(p.death);
    if(!b && !d) return '';
    return (b||'?') + ' – ' + (d||'');
  }
  function findUnionByPartner(personId){
    return Object.values(state.unions).find(u => u.partners.includes(personId));
  }
  function allChildIds(){
    const set = new Set();
    Object.values(state.unions).forEach(u => u.children.forEach(c=>set.add(c)));
    return set;
  }
  function allPartneredIds(){
    const set = new Set();
    Object.values(state.unions).forEach(u => u.partners.forEach(p=>set.add(p)));
    return set;
  }

  // ---------- Render tree ----------
  function render(){
    const container = document.getElementById('treeContainer');
    const childIds = allChildIds();
    const partnered = allPartneredIds();

    // Determine root entities: unions with no partner in childIds, and lone persons not in any union & not a child
    const renderedUnions = new Set();
    const roots = [];

    Object.values(state.unions).forEach(u=>{
      const hasChildParent = u.partners.some(pid => childIds.has(pid));
      if(!hasChildParent && !renderedUnions.has(u.id)){
        roots.push({type:'union', id:u.id});
        renderedUnions.add(u.id);
      }
    });
    Object.values(state.people).forEach(p=>{
      if(!childIds.has(p.id) && !partnered.has(p.id)){
        roots.push({type:'person', id:p.id});
      }
    });

    if(roots.length === 0){
      container.innerHTML = '<div class="empty"><h2>Aún no hay nadie en el árbol</h2><p>Usa "+ Agregar persona" para comenzar.</p></div>';
    } else {
      let html = '<div class="tree"><ul>';
      roots.forEach(r => { html += renderEntityLi(r.type, r.id, childIds); });
      html += '</ul></div>';
      container.innerHTML = html;
    }

    // Unconnected persons: not partnered and not a child of anyone (already shown as roots) -- so instead
    // show persons who are "orphans" meaning single & not connected as spouse/child to guide user; here we skip since roots cover them.
    document.getElementById('unconnectedWrap').style.display = 'none';

    attachCardHandlers();
  }

  function personCardHTML(p, childIdsSet){
    const av = p.photo
      ? `<img src="${escapeAttr(p.photo)}" alt="">`
      : initials(p.name || '?');
    const sexClass = p.sex === 'M' ? 'f' : '';
    const dl = datesLabel(p);
    const card = `
      <div class="card" data-person="${p.id}">
        <div class="avatar ${sexClass}">${p.photo ? av : av}</div>
        <div>
          <div class="name">${escapeHtml(p.name || 'Sin nombre')}</div>
          ${dl ? `<div class="dates">${dl}</div>` : ''}
        </div>
      </div>`;
    const hasParents = childIdsSet && childIdsSet.has(p.id);
    if(hasParents) return card;
    return `<div class="col-wrap">
        <button class="parent-add" data-add-parent="${p.id}" title="Agregar padres">▲ padres</button>
        ${card}
      </div>`;
  }

  function renderEntityLi(type, id, childIdsSet){
    let nodeHtml = '';
    let childrenIds = [];

    if(type === 'union'){
      const u = state.unions[id];
      nodeHtml = '<div class="node">';
      u.partners.forEach((pid, idx) => {
        nodeHtml += personCardHTML(state.people[pid], childIdsSet);
      });
      if(u.partners.length < 2){
        nodeHtml += `<div class="union-plus" data-add-spouse-union="${u.id}" title="Agregar cónyuge">+</div>`;
      }
      nodeHtml += '</div>';
      childrenIds = u.children;
    } else {
      const p = state.people[id];
      nodeHtml = '<div class="node">' + personCardHTML(p, childIdsSet);
      nodeHtml += `<div class="union-plus" data-add-spouse-person="${id}" title="Agregar cónyuge">+</div>`;
      nodeHtml += '</div>';
    }

    let li = '<li><div class="node-wrap">' + nodeHtml;
    const addChildTarget = type === 'union' ? id : ('person:' + id);
    li += `<div style="display:flex; justify-content:center;"><button class="child-add" data-add-child="${addChildTarget}" title="Agregar hijo/a">+</button></div>`;
    li += '</div>';

    if(childrenIds.length){
      li += '<ul>';
      childrenIds.forEach(cid => {
        const cu = findUnionByPartner(cid);
        if(cu){
          li += renderEntityLi('union', cu.id, childIdsSet);
        } else {
          li += renderEntityLi('person', cid, childIdsSet);
        }
      });
      li += '</ul>';
    }
    li += '</li>';
    return li;
  }

  function escapeHtml(str){
    return (str||'').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }
  function escapeAttr(str){ return escapeHtml(str); }

  // ---------- Card / button interactions ----------
  function attachCardHandlers(){
    document.querySelectorAll('[data-person]').forEach(el=>{
      el.onclick = (e)=>{
        e.stopPropagation();
        openEditPerson(el.getAttribute('data-person'));
      };
    });
    document.querySelectorAll('[data-add-spouse-union]').forEach(el=>{
      el.onclick = (e)=>{ e.stopPropagation(); openAddSpouse({unionId: el.getAttribute('data-add-spouse-union')}); };
    });
    document.querySelectorAll('[data-add-spouse-person]').forEach(el=>{
      el.onclick = (e)=>{ e.stopPropagation(); openAddSpouse({personId: el.getAttribute('data-add-spouse-person')}); };
    });
    document.querySelectorAll('[data-add-child]').forEach(el=>{
      el.onclick = (e)=>{ e.stopPropagation(); openAddChild(el.getAttribute('data-add-child')); };
    });
    document.querySelectorAll('[data-add-parent]').forEach(el=>{
      el.onclick = (e)=>{ e.stopPropagation(); openAddParents(el.getAttribute('data-add-parent')); };
    });
  }

  // ---------- Modal system ----------
  const overlay = document.getElementById('overlay');
  const modalBody = document.getElementById('modalBody');
  const modalTitle = document.getElementById('modalTitle');

  function openModal(title, bodyHtml){
    modalTitle.textContent = title;
    modalBody.innerHTML = bodyHtml;
    overlay.classList.add('open');
  }
  function closeModal(){
    overlay.classList.remove('open');
    currentContext = null;
  }
  document.getElementById('modalClose').onclick = closeModal;
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeModal(); });

  function personFormFields(p){
    p = p || {name:'', birth:'', death:'', sex:'H', photo:''};
    return `
      <div class="field">
        <label>Nombre completo *</label>
        <input type="text" id="f_name" value="${escapeAttr(p.name)}" placeholder="Ej. Juan Pérez López">
      </div>
      <div class="row2">
        <div class="field">
          <label>Fecha nacimiento</label>
          <input type="date" id="f_birth" value="${p.birth||''}">
        </div>
        <div class="field">
          <label>Fecha fallecimiento</label>
          <input type="date" id="f_death" value="${p.death||''}">
        </div>
      </div>
      <div class="field">
        <label>Sexo</label>
        <div class="sex-toggle">
          <button type="button" class="sex-btn ${p.sex==='H'?'active':''}" data-sex="H">Hombre</button>
          <button type="button" class="sex-btn ${p.sex==='M'?'active':'' } f" data-sex="M">Mujer</button>
        </div>
      </div>
      <div class="field">
        <label>Foto (URL, opcional)</label>
        <input type="url" id="f_photo" value="${escapeAttr(p.photo)}" placeholder="https://...">
      </div>
    `;
  }

  function wireSexToggle(){
    let selected = document.querySelector('.sex-btn.active');
    document.querySelectorAll('.sex-btn').forEach(btn=>{
      btn.onclick = ()=>{
        document.querySelectorAll('.sex-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
      };
    });
  }
  function getSelectedSex(){
    const active = document.querySelector('.sex-btn.active');
    return active ? active.getAttribute('data-sex') : 'H';
  }

  // Add root / standalone person
  document.getElementById('btnAddRoot').onclick = ()=>{
    currentContext = {mode:'root'};
    openModal('Agregar persona', personFormFields() + `
      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancelBtn">Cancelar</button>
        <button class="btn btn-primary" id="saveBtn">Guardar</button>
      </div>
    `);
    wireSexToggle();
    document.getElementById('cancelBtn').onclick = closeModal;
    document.getElementById('saveBtn').onclick = handleSaveNewPerson;
  };

  function openAddSpouse(ctx){
    currentContext = {mode:'spouse', ...ctx};
    const existingOptions = Object.values(state.people)
      .filter(p => !allPartneredIds().has(p.id))
      .map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');
    openModal('Agregar cónyuge', `
      <div class="field">
        <label>¿Cómo agregar?</label>
        <select id="f_mode">
          <option value="new">Persona nueva</option>
          ${existingOptions ? '<option value="existing">Vincular persona existente sin pareja</option>' : ''}
        </select>
      </div>
      <div id="dynamicFields">${personFormFields()}</div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancelBtn">Cancelar</button>
        <button class="btn btn-primary" id="saveBtn">Guardar</button>
      </div>
    `);
    wireSexToggle();
    document.getElementById('f_mode').onchange = (e)=>{
      const dyn = document.getElementById('dynamicFields');
      if(e.target.value === 'existing'){
        dyn.innerHTML = `<div class="field"><label>Selecciona persona</label>
          <select id="f_existing">${existingOptions}</select></div>`;
      } else {
        dyn.innerHTML = personFormFields();
        wireSexToggle();
      }
    };
    document.getElementById('cancelBtn').onclick = closeModal;
    document.getElementById('saveBtn').onclick = handleSaveSpouse;
  }

  async function handleSaveSpouse(){
    const modeSel = document.getElementById('f_mode').value;
    let newPersonId;
    if(modeSel === 'existing'){
      newPersonId = document.getElementById('f_existing').value;
    } else {
      const name = document.getElementById('f_name').value.trim();
      if(!name){ showToast('El nombre es obligatorio'); return; }
      newPersonId = uid('p');
      state.people[newPersonId] = {
        id:newPersonId, name,
        birth:document.getElementById('f_birth').value,
        death:document.getElementById('f_death').value,
        sex:getSelectedSex(),
        photo:document.getElementById('f_photo').value.trim()
      };
    }

    if(currentContext.unionId){
      state.unions[currentContext.unionId].partners.push(newPersonId);
    } else if(currentContext.personId){
      const newUnionId = uid('u');
      state.unions[newUnionId] = {id:newUnionId, partners:[currentContext.personId, newPersonId], children:[]};
    }
    await saveState();
    closeModal();
    render();
    showToast('Cónyuge agregado');
  }

  function openAddChild(target){
    // target is either a union id, or "person:<id>" for a lone person (creates a union first)
    currentContext = {mode:'child', target};
    const existingOptions = Object.values(state.people)
      .map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');
    openModal('Agregar hijo/a', `
      <div class="field">
        <label>¿Cómo agregar?</label>
        <select id="f_mode">
          <option value="new">Persona nueva</option>
          <option value="existing">Vincular persona ya existente</option>
        </select>
      </div>
      <div id="dynamicFields">${personFormFields()}</div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancelBtn">Cancelar</button>
        <button class="btn btn-primary" id="saveBtn">Guardar</button>
      </div>
    `);
    wireSexToggle();
    document.getElementById('f_mode').onchange = (e)=>{
      const dyn = document.getElementById('dynamicFields');
      if(e.target.value === 'existing'){
        dyn.innerHTML = `<div class="field"><label>Selecciona persona</label>
          <select id="f_existing">${existingOptions}</select></div>`;
      } else {
        dyn.innerHTML = personFormFields();
        wireSexToggle();
      }
    };
    document.getElementById('cancelBtn').onclick = closeModal;
    document.getElementById('saveBtn').onclick = handleSaveChild;
  }

  async function handleSaveChild(){
    const modeSel = document.getElementById('f_mode').value;
    let childId;
    if(modeSel === 'existing'){
      childId = document.getElementById('f_existing').value;
    } else {
      const name = document.getElementById('f_name').value.trim();
      if(!name){ showToast('El nombre es obligatorio'); return; }
      childId = uid('p');
      state.people[childId] = {
        id:childId, name,
        birth:document.getElementById('f_birth').value,
        death:document.getElementById('f_death').value,
        sex:getSelectedSex(),
        photo:document.getElementById('f_photo').value.trim()
      };
    }

    let unionId = currentContext.target;
    if(unionId.startsWith('person:')){
      const personId = unionId.replace('person:', '');
      unionId = uid('u');
      state.unions[unionId] = {id:unionId, partners:[personId], children:[]};
    }
    if(!state.unions[unionId].children.includes(childId)){
      state.unions[unionId].children.push(childId);
    }
    await saveState();
    closeModal();
    render();
    showToast('Hijo/a agregado');
  }

  function personFormFieldsPrefixed(prefix, p){
    p = p || {name:'', birth:'', death:'', photo:''};
    return `
      <div class="field">
        <label>Nombre completo</label>
        <input type="text" id="${prefix}_name" value="${escapeAttr(p.name||'')}" placeholder="Nombre Apellido">
      </div>
      <div class="row2">
        <div class="field">
          <label>Fecha nacimiento</label>
          <input type="date" id="${prefix}_birth" value="${p.birth||''}">
        </div>
        <div class="field">
          <label>Fecha fallecimiento</label>
          <input type="date" id="${prefix}_death" value="${p.death||''}">
        </div>
      </div>
      <div class="field">
        <label>Foto (URL, opcional)</label>
        <input type="url" id="${prefix}_photo" value="${escapeAttr(p.photo||'')}" placeholder="https://...">
      </div>
    `;
  }

  function openAddParents(personId){
    currentContext = {mode:'parents', personId};
    const person = state.people[personId];
    const existingOptions = Object.values(state.people)
      .filter(p => p.id !== personId)
      .map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');

    openModal('Agregar padres de ' + person.name, `
      <p class="hint">Completa uno o ambos. Si la persona ya existe en el árbol, puedes vincularla en vez de crear una nueva.</p>
      <div style="border:1px solid var(--paper-2); border-radius:10px; padding:12px; margin-bottom:14px;">
        <label style="display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--sage-dark); margin-bottom:8px;">Padre</label>
        <select id="f_mode_father" style="margin-bottom:10px; width:100%; padding:8px; border-radius:8px; border:1px solid var(--paper-2);">
          <option value="none">No agregar</option>
          <option value="new">Persona nueva</option>
          ${existingOptions ? '<option value="existing">Vincular persona existente</option>' : ''}
        </select>
        <div id="fatherFields"></div>
      </div>
      <div style="border:1px solid var(--paper-2); border-radius:10px; padding:12px; margin-bottom:14px;">
        <label style="display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--wine-dark); margin-bottom:8px;">Madre</label>
        <select id="f_mode_mother" style="margin-bottom:10px; width:100%; padding:8px; border-radius:8px; border:1px solid var(--paper-2);">
          <option value="none">No agregar</option>
          <option value="new">Persona nueva</option>
          ${existingOptions ? '<option value="existing">Vincular persona existente</option>' : ''}
        </select>
        <div id="motherFields"></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancelBtn">Cancelar</button>
        <button class="btn btn-primary" id="saveBtn">Guardar</button>
      </div>
    `);

    function refreshFatherFields(){
      const mode = document.getElementById('f_mode_father').value;
      const el = document.getElementById('fatherFields');
      if(mode === 'new') el.innerHTML = personFormFieldsPrefixed('father');
      else if(mode === 'existing') el.innerHTML = `<div class="field"><label>Selecciona persona</label><select id="father_existing">${existingOptions}</select></div>`;
      else el.innerHTML = '';
    }
    function refreshMotherFields(){
      const mode = document.getElementById('f_mode_mother').value;
      const el = document.getElementById('motherFields');
      if(mode === 'new') el.innerHTML = personFormFieldsPrefixed('mother');
      else if(mode === 'existing') el.innerHTML = `<div class="field"><label>Selecciona persona</label><select id="mother_existing">${existingOptions}</select></div>`;
      else el.innerHTML = '';
    }
    document.getElementById('f_mode_father').onchange = refreshFatherFields;
    document.getElementById('f_mode_mother').onchange = refreshMotherFields;

    document.getElementById('cancelBtn').onclick = closeModal;
    document.getElementById('saveBtn').onclick = handleSaveParents;
  }

  async function handleSaveParents(){
    const personId = currentContext.personId;
    const fatherMode = document.getElementById('f_mode_father').value;
    const motherMode = document.getElementById('f_mode_mother').value;
    let fatherId = null, motherId = null;

    if(fatherMode === 'existing'){
      fatherId = document.getElementById('father_existing').value;
    } else if(fatherMode === 'new'){
      const name = document.getElementById('father_name').value.trim();
      if(name){
        fatherId = uid('p');
        state.people[fatherId] = {
          id:fatherId, name,
          birth:document.getElementById('father_birth').value,
          death:document.getElementById('father_death').value,
          sex:'H',
          photo:document.getElementById('father_photo').value.trim()
        };
      }
    }
    if(motherMode === 'existing'){
      motherId = document.getElementById('mother_existing').value;
    } else if(motherMode === 'new'){
      const name = document.getElementById('mother_name').value.trim();
      if(name){
        motherId = uid('p');
        state.people[motherId] = {
          id:motherId, name,
          birth:document.getElementById('mother_birth').value,
          death:document.getElementById('mother_death').value,
          sex:'M',
          photo:document.getElementById('mother_photo').value.trim()
        };
      }
    }

    if(!fatherId && !motherId){
      showToast('Agrega al menos un padre o madre');
      return;
    }

    const partners = [fatherId, motherId].filter(Boolean);
    const newUnionId = uid('u');
    state.unions[newUnionId] = {id:newUnionId, partners, children:[personId]};

    await saveState();
    closeModal();
    render();
    showToast('Padres agregados');
  }

  async function handleSaveNewPerson(){
    const name = document.getElementById('f_name').value.trim();
    if(!name){ showToast('El nombre es obligatorio'); return; }
    const id = uid('p');
    state.people[id] = {
      id, name,
      birth:document.getElementById('f_birth').value,
      death:document.getElementById('f_death').value,
      sex:getSelectedSex(),
      photo:document.getElementById('f_photo').value.trim()
    };
    await saveState();
    closeModal();
    render();
    showToast('Persona agregada');
  }

  // Edit existing person
  function openEditPerson(personId){
    currentContext = {mode:'edit', personId};
    const p = state.people[personId];
    openModal('Editar persona', personFormFields(p) + `
      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancelBtn">Cancelar</button>
        <button class="btn btn-primary" id="saveBtn">Guardar cambios</button>
      </div>
      <hr class="divider">
      <button class="btn btn-danger" id="deleteBtn" style="width:100%;">Eliminar persona</button>
    `);
    wireSexToggle();
    document.getElementById('cancelBtn').onclick = closeModal;
    document.getElementById('saveBtn').onclick = async ()=>{
      const name = document.getElementById('f_name').value.trim();
      if(!name){ showToast('El nombre es obligatorio'); return; }
      p.name = name;
      p.birth = document.getElementById('f_birth').value;
      p.death = document.getElementById('f_death').value;
      p.sex = getSelectedSex();
      p.photo = document.getElementById('f_photo').value.trim();
      await saveState();
      closeModal();
      render();
      showToast('Cambios guardados');
    };
    document.getElementById('deleteBtn').onclick = async ()=>{
      if(!confirm('¿Eliminar a ' + p.name + '? Esta acción no se puede deshacer.')) return;
      // Remove from unions as partner
      Object.values(state.unions).forEach(u=>{
        u.partners = u.partners.filter(id=>id!==personId);
        u.children = u.children.filter(id=>id!==personId);
      });
      // Remove unions that now have zero partners and zero children
      Object.keys(state.unions).forEach(uid=>{
        const u = state.unions[uid];
        if(u.partners.length === 0){
          delete state.unions[uid];
        }
      });
      delete state.people[personId];
      await saveState();
      closeModal();
      render();
      showToast('Persona eliminada');
    };
  }

  document.getElementById('btnResetView').onclick = async ()=>{
    await loadState();
    render();
    showToast('Datos actualizados');
  };

  // ---------- Init ----------
  (async function init(){
    await loadState();
    render();
  })();
})();
</script>
</body>
</html>
